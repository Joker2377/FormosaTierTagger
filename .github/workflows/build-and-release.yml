name: Build and Release

on:
  push:
    branches: [ copilot/update-data-input-from-api ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiers-mod
          path: build/libs/*.jar

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.4-alpha
          name: Formosa Tier Tagger v0.7.4+1.21.1 Alpha
          body: |
            ## Formosa Tier Tagger v0.7.4+1.21.1 Alpha
            
            First alpha release with Formosa Tier List API integration.
            
            ### Changes
            - Replaced MCTiers/PvPTiers/Subtiers with Formosa Tier List API
            - UUID-first API query design (with name-based fallback)
            - Simplified single tier list UI
            - Supports Minecraft 1.21.1+
            
            ### Requirements
            - Minecraft 1.21.1+
            - Fabric Loader >=0.16.5
            - Fabric API
            - Java 21+
          files: build/libs/*.jar
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
